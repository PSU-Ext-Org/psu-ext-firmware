name: Build firmware

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ESP-IDF 6.0 build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: stable
          cache: false

      - name: Install addlicense
        run: go install github.com/google/addlicense@v1.2.0

      - name: Check license headers
        run: >-
          addlicense -check -l apache -c "PSU-EXT Authors" -y 2026
          -ignore "build/**"
          -ignore "test/unit/build/**"
          -ignore "managed_components/**"
          .

      - name: Install ESP-IDF
        uses: espressif/install-esp-idf-action@v1
        with:
          version: v6.0

      - name: Compile firmware
        run: idf.py build
